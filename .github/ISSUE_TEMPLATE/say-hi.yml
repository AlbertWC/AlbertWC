name: Say hi
description: Get in touch with Albert about a role, a project or anything else.
title: "Hi Albert, let's connect"
body:
  - type: textarea
    id: message
    attributes:
      label: Message
      description: This issue is public, so please don't share private details here.
      value: |
        Hi Albert,

        I came across your website and would like to connect about [a role / a project].
    validations:
      required: true
